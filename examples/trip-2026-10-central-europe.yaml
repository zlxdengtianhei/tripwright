# The 8-day trip of the public showcase (25 Oct - 1 Nov 2026), as a tripwright trip plus what the share page needs besides it.
# Source: the pages the trip's owner already published (trip-map-2026, English and 中文). The `log` section quotes the owner's
# own messages from the road; most of them are on those pages already, a few clauses appear here for the first time.
#   trip     the Trip shape (src/tripwright/trip.py); Chinese is the original text
#   english  each Chinese text above -> its English, used by the share page's EN side
#   share    editorial extras of the home page: intro and route (stops with the leg to the next one; lat/lon of the city dot)
#   log      the trip log page: what the traveler typed on the road, how the old setup (a private Git repository plus a
#            Claude Code session) handled it, and what tripwright does now. Texts are {zh, en} pairs; `retold` marks a
#            paraphrase. A piece may also carry a `replay` (the same message given to tripwright, shown as given).
#            The two replays below were run on 2026-11-12 with real timetables, at commits 6a3135b and 822ac26 (same code).
# A place to stay appears only as its district and type ("stay-N" is a placeholder name that the share page never prints).
# Build the page: uv run python -m tripwright.site.example examples/trip-2026-10-central-europe.yaml <out-folder>
# Stored in a service, the plan check still reports 8 key times as conflicts: 26 Oct 12:44; 29 Oct 14:35, 15:00, 16:52 and
# 17:47; 31 Oct 17:30, 21:50 and 23:53. They are moments inside a block (taking the metro on the way, signing up at the
# climbing hall), a latest time to leave, or times that belong to one of the day's plans; the check reads every key time as
# a place to reach after the block before it. They are not contradictions in the trip.
