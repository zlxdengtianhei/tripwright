    then:
      zh: '当晚，它把第二天午饭那家三道菜约 €50 的店换成更便宜的一家，另备一家，并在车票须知里补了湖区的通票：一张 €26.50 的日票。'
      en: 'That evening it swapped the three-course lunch planned for the next day (about €50) for a cheaper restaurant, with a second one as backup, and added the regional pass to the ticket notes: a day ticket at €26.50.'
    became:
      zh: '你说过的预算上限会连原话一起存下来，之后凡是它管得到的问题，服务都把它带回给助手，不靠助手记得。要核事实时，查证的角色先读你存的材料（你以前的检索），再查实时来源，最后才查开放网页；网页上的说法只写“网上说法”并带出处，不写成“核过”。'
      en: 'A budget limit you state is stored with your exact words, and the service hands it back to the assistant with every later question it applies to, so it does not depend on the assistant remembering it. When a fact needs checking, the researcher role reads your saved material first (your earlier searches), then live sources, and only then the open web. What a web page says is labelled as a web claim with its source, not as checked.'
    match: {zh: 对上, en: Matches}

  - id: no-workflow
    title: {zh: 别让我走你的流程, en: '“Don''t make me follow your workflow”'}
    when:
      zh: '2026-10-27 周二，11:58，维也纳'
      en: 'Tue 27 Oct 2026, 11:58, Vienna'
    said:
    - time: '11:58'
      zh: '你要是给我直接的回答，并且……你要去标注这种目的地，还有包括这个走法、时间的安排'
      en: 'If you give me a direct answer, and … you label the destination, and the route and the timing as well.'
    - zh: '我肯定不会按照这个流程来做'
      en: 'I definitely won''t follow this process.'
    - zh: '有一个那个一键的这个就是说标记做完什么的这样的一种东西'
      en: 'Something with one tap, you know, for marking what''s done.'
    then:
      zh: '随后，网站多了一个一键“✓ 做完”，点了之后复制一段状态交给助手同步；操作指南改成：路上的问题在对话里答全。'
      en: 'Soon after, the website had a one-tap “✓ Done” button that copies the state for the assistant to sync, and the operating guide changed to say that road questions are answered in full in the chat.'
    became:
      zh: '前半对上：回答直接在对话里给，每一程写明开哪个 App、搜什么。“一键做完”没有带过来：tripwright 没有这个按钮，做完一件事靠你对助手说一声。'
      en: 'The first half matches: answers come in the chat, and each leg says which app to open and what to search. The one-tap “Done” button did not carry over. tripwright has no such button; a step counts as done when you tell the assistant.'
    match: {zh: 部分对上；“一键做完”没有, en: 'Partly matches; no one-tap “Done”'}

  - id: rainy-day
    title: {zh: 雨天：一上午改了好几次, en: 'Rainy day: re-planned several times before noon'}
    when:
      zh: '2026-10-28 周三，08:58–11:17，巴德伊舍与沃尔夫冈湖'
      en: 'Wed 28 Oct 2026, 08:58–11:17, Bad Ischl and the Wolfgangsee lake'
    said:
    - time: '08:58'
      zh: '今天天气不太好……想过得轻松一点。现在我们刚醒……出门估计至少要10点了。……只坐船……缆车就不坐了……赶在大致下雨之前回来，看看能不能去抱石（我们一共四个人）……晚上回来自己做火锅'
      en: 'The weather isn''t good today … I want to take it easy. We''ve just woken up … it will be at least 10 before we leave … only the boat … skip the cable car … get back before it roughly starts raining, see if we can go bouldering (there are four of us in total) … make hotpot ourselves in the evening.'
    - time: '09:45'
      retold: true
      zh: '问：如果赶不上 10 点出门，下一趟怎么排。'
      en: 'Asked what the schedule would look like if we could not leave at 10.'
    - time: '11:12'
      retold: true
      zh: '说现在出门，要一份按当前时间排的计划。'
      en: 'Said we were heading out now and asked for a plan from the current time.'
    - time: '11:17'
      retold: true
      zh: '说已经吃过饭，下午回到巴德伊舍之前不用再排吃饭，要求重排。'
      en: 'Said we had eaten, so no meal was needed before we were back in Bad Ischl in the afternoon, and asked for a new plan.'
    then:
      zh: '中午前它把这一天改了好几次，每次留了理由。先按早上的天气预报把这一天倒过来走（先去 St. Gilgen，再坐 12:00 的船到 St. Wolfgang）；又补上更晚的后备出发时刻；我们说吃过饭之后，改成 12:12 出发，去掉午饭。'
      en: 'It changed the day several times before noon, each time with its reason. First it reversed the day using the morning forecast (St. Gilgen first, then the 12:00 boat to St. Wolfgang). Then it added later backup departures. After we said we had eaten, it moved the departure to 12:12 and removed lunch.'
    became:
      zh: '普通的安排有理由就可以改，每次被接受的改动都存下改了什么、谁改的、为什么。回答从“现在几点”算起，不从计划里写的时刻算起；天气来自预报来源，查到的结果会过期。'
      en: 'Ordinary choices may change when there is a reason, and each accepted change is saved with what changed, who changed it and why. Answers start from the time now, not from the times written in the plan. Weather comes from a forecast source, and a forecast result expires.'
    match: {zh: 对上, en: Matches}

  - id: preference-not-used
    title: {zh: “为什么没用我的偏好？”, en: '“Why didn''t you use my preference?”'}
    when:
      zh: '2026-10-30 周五，20:13，维也纳'
      en: 'Fri 30 Oct 2026, 20:13, Vienna'
    said:
    - time: '20:13'
      zh: '你这次第一段输出也太久了吧……明天的话我的下午活动可以考虑攀岩，这个我的preference里……你为啥没有参考到？你是否有忘记使用我们旅行系统的情况，另外我的要求原话都记录了吗'
      en: 'Your first part took way too long this time … tomorrow my afternoon activity could be climbing, that''s in my preferences … why didn''t you use it? Did you forget to use our travel system? And were my exact words all recorded?'
    then:
      zh: '随后，它往操作指南里写了两条：第一段要在 3 分钟内给出，只答接下来的一两个小时；第二段先读偏好概览，再排计划。'
      en: 'It then wrote two rules into the guide. The first part must come within 3 minutes and answer only the next one or two hours. The second part must read the preference overview before it plans.'
    became:
      zh: '每条讲行程的消息，助手都要先调用 turn；它返回这条消息用得上的已存偏好（这里是攀岩），存着的计划答得上时还给出一段现成的第一条回复。每条偏好都存着你的原话和出处，“记忆”页上写着它最近用在哪、还是还没用过。助手照不照做，仍然要看回答。'
      en: 'For every message about a trip the assistant must call turn first. It returns the stored preferences that apply to the message (here, climbing) and, when the stored plan can answer, a ready first reply. Each preference keeps your exact words and where they came from, and the memory page shows where it was last used, or that it has not been used yet. Whether the assistant follows this still has to be checked in the answer.'
    match: {zh: 对上，照不照做要看回答, en: 'Matches; the answer still has to be checked'}

  - id: give-me-the-choice
    title: {zh: “给我选择，别替我砍掉偏好”, en: '“Give me the choice, don''t cut my preference”'}
    when:
      zh: '2026-10-30 周五，23:32，维也纳'
      en: 'Fri 30 Oct 2026, 23:32, Vienna'
    said:
    - time: '23:32'
      zh: '你的轻松一点考虑不抱石其实问题不大 但是因为我的preference还是应该考虑并且给我选择的 然后我明天就是去个大点的岩馆吧'
      en: 'Considering “take it easy” and not bouldering is actually not a big problem, but my preference should still be considered, and you should give me the choice. So tomorrow I''ll just go to a bigger climbing gym.'
    - zh: '我甚至觉得可以考虑在岩馆呆一天'
      en: 'I even think we could consider spending a whole day at the gym.'
    then:
      zh: '当晚，第二天给回了三套：老城免费逛加市场加下午去大岩馆（标为推荐）；在岩馆待一整天；上午去博物馆。操作指南加了一条：偏好要考虑，并且给我选择。'
      en: 'That night the next day came back as three plans: a free old-town walk, the market and an afternoon at a big gym (marked as recommended); a whole day at the gym; a museum in the morning. The guide gained a rule: preferences count, and I get a choice.'
    became:
      zh: '你的两条偏好互相挤的时候，tripwright 要助手给两到三套方案，不替你在两条偏好之间取舍；偏好之间谁让谁，只听你说。推荐要有事实理由（天气、末班车的风险、关门），不能凭助手的口味。这一处比旧做法严：当时的“推荐”是它自己判断的。'
      en: 'When two of your preferences compete, tripwright has the assistant offer two or three options and never trades one preference against the other. Which preference gives way comes only from you. A recommendation needs a factual reason (weather, last-bus risk, a closure), not the assistant''s taste. This is stricter than the old setup, which picked its recommendation by its own judgement.'
    match: {zh: 对上，有一处更严, en: 'Matches, and stricter in one place'}

  - id: on-my-own
    title: {zh: “今天我是一个人”, en: '“I''m on my own today”'}
    when:
      zh: '2026-10-31 周六，11:35，维也纳（语音输入）'
      en: 'Sat 31 Oct 2026, 11:35, Vienna (dictated)'
    said:
    - time: '11:35'
      zh: '我要是今天来安排的话……我应该是一个人，对吧？那一个人的话，我自己就不涉及要拿箱子'
      en: 'If I''m arranging today … I should be on my own, right? Being alone, I don''t have a suitcase to deal with.'
    - zh: '攀岩也是不需要去租鞋的'
      en: 'I don''t need to rent shoes for the climbing either.'
    - zh: '需求的记录……不仅是要有一些决策树，可能还需要有一些……preference 的 save'
      en: 'For the record of requirements … not only decision trees, there probably also needs to be some … saving of preferences.'
    - retold: true
      zh: '背景：三位同行人这天去机场。'
      en: 'Background: my three companions left for the airport that day.'
    then:
      zh: '随后，这一天按一个人重排：中央车站午饭、走去岩馆、免费的教堂、晚上去办万圣节活动的岩馆。概览里加了“按人”一条，指南里加了一条“逐块对人”。'
      en: 'The day was then re-planned for one person. Lunch at the main station, a walk to the gym, free churches, and in the evening the gym with the Halloween event. The overview gained a “per person” entry, and the guide a rule to plan each block for the person it concerns.'
    became:
      zh: '计划里每一块都写明是谁的。只属于某个人的事（例如拿行李）要写明由谁负责，提交计划时会核这个人是不是在这一块里。“不用租鞋”这类偏好存成带原话的记录。'
      en: 'Every block of the plan says who it is for. A task that belongs to one person, such as carrying the luggage, names its holder, and a commit checks that this person is in the block. A preference like “no shoe rental” is stored as a record with your exact words.'
    match: {zh: 对上, en: Matches}

  - id: latest-time
    title: {zh: 先轻松、后省钱：再告诉我最晚几点, en: 'Easy first, then cheap: and tell me the latest time'}
    when:
      zh: '2026-10-31 周六，13:48，维也纳'
      en: 'Sat 31 Oct 2026, 13:48, Vienna'
    said:
    - time: '13:48'
      zh: '你让我走路的话呢，这个就就太远了。而且我也说过，我们最后一天这个要稍微的轻松一点……那你如果只考虑这个省钱，那我觉得是不对的'
      en: 'If you make me walk, that''s too far. And I did say that on the last day we should take it a bit easier … if you only consider saving money, I think that''s wrong.'
    - zh: '你在第二轮的里面也没有去做这些核验，那我觉得这就有问题了呀'
      en: 'In the second round you didn''t do these checks either, so I think that''s a problem.'
    - zh: '你去说一个最最迟的时间，让我有一个这个底……机场能不能进去，我过夜怎么过'
      en: 'Tell me the very latest time, so I have a bottom line … can I get into the airport, and how do I spend the night?'
    then:
      zh: '随后一次改完：换成 24 小时票，补机场段 €2.30；下午重排为岩馆、两座免费教堂、万圣节团队赛、22:42 的 Railjet。当天的页面新增“硬节点”一节：末班车 23:53、夜班大巴、航空公司值机 05:45 截止、在机场过夜。指南加了一条：整天一起排，轻松先于省钱。'
      en: 'One change followed. A 24-hour ticket with a €2.30 supplement for the airport leg, and a new afternoon: the gym, two free churches, the Halloween team contest, the 22:42 Railjet. The day page gained a “Hard nodes” section: last train 23:53, a night bus, the airline''s check-in cut-off at 05:45, and the airport as the place to spend the night. The guide gained a rule: plan the whole day together; easy before cheap.'
    became:
      zh: '计划里定死的时刻存成硬节点；问“今晚最晚几点”时，服务用查到的班次算末班和最晚出发时刻，查询盖不到的时段要说没查到。只有第三方说法的事（例如机场夜里能不能待）写成“没核”，并写后果和到现场怎么办。你像这里这样明说了偏好的先后，就存成你定的顺序。'
      en: 'Fixed times in the plan are stored as hard nodes. For “what is the latest tonight”, the service works out the last connection and the latest time to leave from the departures it looked up, and has to say which hours the lookup did not cover. A claim that comes only from a third party, such as staying in the airport overnight, is written as not checked, with the consequence and what to do on site. When you state an order between preferences, as here, it is stored as your order.'
    match: {zh: 对上, en: Matches}
    replay:
      setup:
        zh: '这一段是用现在的版本重放的，不是旅行当时的记录。2026-11-12 跑的：tripwright 提交 822ac26；一个只连着 tripwright 的聊天宿主（没有别的说明文件），模型 DeepSeek V4.1 Flash；时钟拨回 2026-10-31 13:48；时刻表是 2026-11-12 从 Transitous 查的真实时刻表。存着的行程是公开仓里这趟旅行的行程仓副本（examples/trip-2026-10-bud-wien），它存的是 10-31 这天结束时的计划，所以计划里已经有当天下午定下的安排。同一句话用中文问了 2 次，这里放其中 1 次，原样；两次回复里查过的班次，给出的时刻都与当次查到的一致。发的是第三句，中间省掉的几个字没有发。'
        en: 'This was replayed with the current version; it is not a record from the trip. It was replayed in Chinese; translated here. Run on 12 Nov 2026: tripwright at commit 822ac26; a chat host connected only to tripwright (no other instruction file), model DeepSeek V4.1 Flash; the clock set back to 31 Oct 2026, 13:48; real timetables, looked up from Transitous on 12 Nov 2026. The stored trip is the copy of this trip''s repository in the public repository (examples/trip-2026-10-bud-wien). It holds the plan as it stood at the end of 31 Oct, so the plan already contains what was decided that afternoon. The message was sent 2 times in Chinese; shown here is 1 of them, translated sentence by sentence, with times, lines and stop names unchanged. In both replies, the times given for the rides it looked up match what that run found. Only the third message was sent, without the words left out in the middle.'
      asked:
        zh: '你去说一个最最迟的时间，让我有一个这个底。机场能不能进去，我过夜怎么过'
        en: 'Tell me the very latest time, so I have a bottom line. Can I get into the airport, and how do I spend the night?'
      parts:
      - label: {zh: '第一条回复（8 秒，来自存着的计划）', en: 'First reply (8 s, from the stored plan; replayed in Chinese, translated here)'}
        text:
          zh: |-
            按存的计划先说（时刻还没核）
            按现在 13:48 算，假设你在 Som Kitchen （计划里这时在这；不在的话说一声）
            明早 05:45 Ryanair 网上值机截止（起飞前 2 小时）；拿非欧盟/EEA 护照的，这时前排到 Visa/Document check 柜台盖章（存档，没核）

            要核过的第二段，回我一句“继续”。
          en: |-
            From the stored plan first (times not checked yet)
            As of now, 13:48, assuming you are at Som Kitchen (the plan has you here at this time; say so if not)
            Tomorrow morning 05:45: Ryanair online check-in deadline (2 hours before departure); with a non-EU/EEA passport, be in the queue at the Visa/Document check counter by this time to get the stamp (archived, not checked)

            For the checked second part, reply “Continue”.
      - label: {zh: '回“继续”之后的第二条回复（51 秒）', en: 'Second reply, after “Continue” (51 s; replayed in Chinese, translated here)'}
        text:
          zh: |-
            ## 核过之后

            **和上面不一样的地方有三点：**一是计划里“误了 22:42 和 22:53 就只剩 23:53 末班 REX”这个说法不对——机场方向真正的末班火车是 **00:53 REX 22787**；二是 22:42 那班 RJX 19959 确认赶得上；三是**“机场能不能进、怎么过夜”我还没核到**（没有能查航站楼开放时间的来源），下面标出来。

            **最最迟的时间（底线）**
            - 从 Wien Hauptbahnhof 上车的最后一班：**00:50 出门，00:53 坐 REX 22787 → 01:15 到 Flughafen Wien Bahnhof，01:16 出来**。这是今晚“还能坐火车进机场”的最后一条线。
            - 错过它，火车就有空档，下一段要等到**凌晨 02:46 出门**：02:52 坐 U1 到 Wien Praterstern，03:03 换 VAB 5，03:31 到机场巴士站，03:33 到。再之后一班是 03:13 出门、03:42 到。
            - 真正不能碰的硬性时间点还是明早 **05:45**：Ryanair 网上值机截止，拿非欧盟/EEA 护照的这时要站到 Visa/Document check 柜台前。从 Wien Hbf 最晚 **05:13 出门**（05:15 VAB 1 从 Wien Hauptbahnhof Süd → 05:40 到 Busterminal，05:42 到）。之后 07:05 柜台关、07:15 登机口关、07:45 起飞、10:05 到斯德哥尔摩 ARN（这几条是存的旧记录，没重核）。

            **今晚完整怎么走（三家岩馆那部分不改）**
            - boulderbar Hannovergasse 22:00 关门，所以 22:00 左右你本来就得出来。出来后有两条：**22:06 出门**，22:19 U4 到 Wien Mitte-Landstraße，22:30 换 CAT 到机场巴士站 22:55（22:56 到）；或者**22:11 出门**，22:16 坐 5B 到 Praterstern，22:33 换 VAB 5，23:01 到（23:03 到）。
            - 如果你更想按原计划走车站那条：**22:39 从 Wien Hbf 出门**，22:42 RJX 19959 → 22:57 到机场火车站。
            - 到机场后就是过夜，明早 05:45 前去盖章。查这些时刻用 ÖBB App 搜 Wien Hauptbahnhof → Flughafen Wien Bahnhof，出发时间填 22:42；想查末班就填 00:53。实时晚点和临时停运时刻表里没有，出门前在 App 里看一眼。

            **票**
            已经买了 24 Stunden Wien 数字票（10-31 下午起市内车，每人约 €9.70），盖到去机场火车的市内段。机场那一段要现场补 ÖBB 机场段补票，约 €2.30；**怎么在 ÖBB Tickets app 里只选“机场 → 维也纳市界”这一段，还没核到**——最省事的做法是到 Hbf 站内售票机或窗口，说你有 24 小时票、只买到机场那一段；实在买不到就买 €5.50 的全程票（多花约 €3.20）。

            **机场能不能进去、过夜怎么过——这块没核到**
            我没有能查航站楼开放时间的第一手来源，所以“夜里能不能留在航站楼里、有没有能躺的地方”这两点现在不能给你当事实。我也试了存过的地点，附近没有任何记着营业时间的地方。要确认只能看维也纳机场官网或问机场：用浏览器开 viennaairport.com 查“night / opening hours”，或者直接打机场服务电话问“can I stay in the terminal overnight”。

            **过夜这块给你两个方案（都能省钱，但方式不同）**
            1. **坐 22:42 / 22:11 的车，23:00 前后就到机场**：在航站楼里等七八个小时，最省，但前提是航站楼夜里能留人——这一点没核，风险在这儿。
            2. **在岩馆待到最后，坐 00:53 末班车，01:16 到**：少在机场干等四五个小时，不用多花一分钱，也不用担心“进不去”占太久；代价是万一末班车出问题就得等 02:46 那趟。
            我倾向方案 2：既把今晚玩满，又把“机场进不进得去”这个没核的风险压到最短时间。要不要我按这个把计划里的出发时间改成 00:50 从 Wien Hbf 出门？

