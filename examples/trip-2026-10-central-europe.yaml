            ## After checking

            **Three things differ from the part above:** first, the plan's claim “miss the 22:42 and the 22:53 and only the 23:53 last REX is left” is wrong — the real last train towards the airport is the **00:53 REX 22787**; second, the 22:42 RJX 19959 is confirmed as catchable; third, **“can you get into the airport, and how to spend the night” I have not been able to check yet** (there is no source that can look up the terminal's opening hours), marked below.

            **The very latest time (bottom line)**
            - The last one boarding at Wien Hauptbahnhof: **leave at 00:50, take the 00:53 REX 22787 → at Flughafen Wien Bahnhof 01:15, out at 01:16**. This is tonight's last line that “still gets you into the airport by train”.
            - Miss it and the trains have a gap; for the next leg you wait until **leaving at 02:46 in the early morning**: 02:52 U1 to Wien Praterstern, change at 03:03 to VAB 5, at the airport bus station 03:31, arrive 03:33. The one after that leaves at 03:13 and arrives 03:42.
            - The hard time you really must not miss is still tomorrow morning's **05:45**: Ryanair online check-in deadline; with a non-EU/EEA passport you have to be standing at the Visa/Document check counter by then. From Wien Hbf, **leave at 05:13 at the latest** (05:15 VAB 1 from Wien Hauptbahnhof Süd → at the Busterminal 05:40, arrive 05:42). After that: counter closes 07:05, gate closes 07:15, takeoff 07:45, arrival at Stockholm ARN 10:05 (these are old stored records, not re-checked).

            **Tonight, the whole way (the part with the three climbing gyms stays as it is)**
            - boulderbar Hannovergasse closes at 22:00, so you have to come out around 22:00 anyway. After that there are two ways: **leave at 22:06**, 22:19 U4 to Wien Mitte-Landstraße, change at 22:30 to the CAT to the airport bus station 22:55 (arrive 22:56); or **leave at 22:11**, 22:16 5B to Praterstern, change at 22:33 to VAB 5, 23:01 (arrive 23:03).
            - If you would rather take the station route of the original plan: **leave Wien Hbf at 22:39**, 22:42 RJX 19959 → at the airport train station 22:57.
            - At the airport you spend the night; go for the stamp before 05:45 tomorrow morning. To look these times up, search Wien Hauptbahnhof → Flughafen Wien Bahnhof in the ÖBB App with departure time 22:42; for the last train, enter 00:53. Real-time delays and short-notice cancellations are not in the timetable; check the App before you leave.

            **Tickets**
            You have already bought the 24 Stunden Wien digital ticket (city transport from the afternoon of 10-31, about €9.70 per person); it covers the city part of the train to the airport. For the airport part, buy the ÖBB airport supplement on site, about €2.30; **how to choose only the “airport → Vienna city boundary” part in the ÖBB Tickets app is not checked yet** — the easiest way is to go to a ticket machine or the counter in Hbf station, say you have a 24-hour ticket, and buy only the part to the airport; if that really cannot be bought, buy the €5.50 full ticket (about €3.20 more).

            **Can you get into the airport, how to spend the night — this part is not checked**
            I have no first-hand source for the terminal's opening hours, so “can you stay in the terminal at night, is there somewhere to lie down” are two points I cannot give you as fact now. I also tried the stored places: nearby there is nothing with stored opening hours. The only way to confirm is the Vienna Airport website or asking the airport: open viennaairport.com in a browser and look for “night / opening hours”, or call the airport service line and ask “can I stay in the terminal overnight”.

            **Two options for the night (both save money, in different ways)**
            1. **Take the 22:42 / 22:11, at the airport around 23:00**: wait seven or eight hours in the terminal; cheapest, but it assumes people can stay in the terminal at night — that is not checked, and that is the risk.
            2. **Stay at the gym until the end, take the 00:53 last train, arrive 01:16**: four or five fewer hours of waiting at the airport, not a cent more, and the worry about “not getting in” lasts a shorter time; the cost is that if the last train has a problem you must wait for the 02:46 one.
            I lean towards option 2: it makes the most of tonight and keeps the unchecked risk of “getting into the airport or not” as short as possible. Shall I change the departure time in the plan to leaving Wien Hbf at 00:50 accordingly?

            (I planned tonight by “save money, walk little, an easy last day”, and dropped the old choice of the “22:53 REX”, because the 00:53 last train is confirmed, so there is no need to leave early; the preferences of joining the Halloween event and resting at the gym are both kept.)