[project]
name = "tripwright"
version = "0.0.1"
description = "A requirement-aware, multi-agent trip planning service delivered over MCP"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "mcp>=2.3",
  "httpx>=0.28",
  "pydantic>=2.14",
  "pyyaml>=6.0",
  "uvicorn>=0.54",
  "jinja2>=3.1",
  "fastmcp-slim[server]>=4.1.4,<5",
]

[project.optional-dependencies]
dev = ["pytest>=9.2", "jsonschema>=4.26"]

[project.scripts]
tripwright = "tripwright.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tripwright"]

[tool.hatch.build.targets.wheel.force-include]
"examples/fjord_demo.yaml" = "tripwright/examples/fjord_demo.yaml"
"skills/tripwright-main" = "tripwright/skills/tripwright-main"
"skills/tripwright-requirements" = "tripwright/skills/tripwright-requirements"
"skills/tripwright-verifier" = "tripwright/skills/tripwright-verifier"
"skills/tripwright-researcher" = "tripwright/skills/tripwright-researcher"

[tool.pytest.ini_options]
testpaths = ["tests"]
