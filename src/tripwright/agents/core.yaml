# The steps of every user message, one source for every entry (S4a): the MCP server instructions, the `steps` and
# `always` that `turn` and the command line's `first-part` return, the main skill and its MCP prompt, and the
# AGENTS.md that `tripwright init` writes (CLAUDE.md imports it). Written for the worst entry: one agent, no
# subagent, no files, an app that may not show text written between tool calls. Each step is one action and a check
# a tool result can show. `python -m tripwright.agents build` regenerates the outputs; tests/agents/test_s4a_core.py
# holds them to this file.
intro: >-
  Tripwright answers each user message about a stored trip in two parts: a first part at once, from what the trip
  stores, then a second part after the facts the user will act on are checked. Do these steps in order; go on when
  a step's check holds.
steps:
  - do: >-
      Call `turn` first for every user message, before writing any text: the text as received, a new `request_id`,
      `scenario: "quick"` for a question on the road, and `points`, each thing the message names as
      `{"kind", "said", "place"}` in the user's words; `points: []` when the message only asks you to go on.
      While Tripwright's tools are still connecting, retry every few seconds (up to about 30) before using the
      command line; never write about connections.
    done: "`turn` returned."
  - do: >-
      If `turn` returned `second_part_due`, this message asks for that question's second part: go to step 5 with
      its `request_id`.
    done: "`second_part_due` is absent, or you are at step 5."
  - do: >-
      If your app runs a subagent in the background and tells you when it reports (Claude Code), dispatch one
      `tripwright-researcher` there now, with each fact for step 5 and what the plan stores of it. Otherwise skip
      this step.
    done: "a researcher runs in the background, or your app has none."
  - do: >-
      Send `first_part.text` as it is (only the form of address and the language may change), before any lookup.
      After step 3 it is the last text of this reply, and the report starts step 5. Otherwise end the reply with
      `first_part.later` as its last line, and the user's next message brings the second part.
    done: "the first text the user sees in this reply is the first part."
  - do: >-
      Check each fact the user will act on (times and hard nodes, what still runs after now, opening hours, events)
      with `query`: `latest_departure` with origin and destination only for the latest or
      last departure, `open_places` for food, `web_evidence` for what a web page says. A subagent may do the
      lookups (`tripwright-researcher`; in Codex `tripwright_researcher`); without one, do them yourself, one after
      another.
    done: "each fact has a `query` result or a report line, or a reason it stays unchecked."
  - do: "If the message decided or changed something, record it with `propose`, then `commit`."
    done: "`commit` accepted it, or there was nothing to record."
  - do: >-
      Write the second part from the results and pass it to `query(kind="check_answer", arguments={"text": <the
      draft>, "part": "second", "request_id": <the question's>})`; rewrite what each `fix` says and check again, at
      most twice.
    done: "`check_answer` returned `ok: true`."
  - do: "Send part 2 once: the draft that passed, unchanged."
    done: "the text sent is the draft that passed."
always:
  - >-
    The user sees only the two parts: send no status line before the first or between the two. No tool result or
    draft is shown; a part is out only when you send it.
  - >-
    核过 only for a Tripwright tool result, never synthetic or demo data; what a web page says is 网上说法 with its source, a search snippet is
    搜索摘要, and what stays unchecked is 没核, with why.
  - The order between preferences comes only from the user.
  - >-
    Stop for the user only before a commit with `accept_unverified`, a change to something the user called a must,
    or anything sent or published to others; every other step goes on without asking.
# Where the long rules are, for an entry that has only the MCP server (the skill has its own table)
read: >-
  When writing the second part, recording, or when a step is unclear, read the prompt `tripwright-main` (the full
  rules: transport sentences, food, the last section, records and locks, the share page after a commit); each
  tool's description holds its
  arguments, and `turn`'s `next` adds what this message needs.
