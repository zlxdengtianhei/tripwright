# Shared rules for chat apps, and the host workflow written into AGENTS.md and the main skill.
intro: >-
  For each trip message: call turn; write any first_part before other tools; check the facts; then answer with second_part_title, differences first, in the user's language.
steps:
  - do: >-
      Call `turn` first with the message, `scenario: "quick"` on the road, and each named thing in `points`. While Tripwright's tools are still connecting, retry every few seconds (up to about 30) before using the command line; never write about connections.
    done: "`turn` returned."
  - do: >-
      Send `first_part.text` and end this reply without another tool. If you can dispatch a background `tripwright-researcher`, dispatch it to check the facts before ending.
    done: "the first text is the service's first part and the reply has ended, or none was supplied."
  - do: >-
      After the user replies or the researcher returns, do not call `turn`; query every fact directly. Write the second part in that next message.
    done: "each actionable fact has a query result or an unchecked label, and no second turn was called."
  - do: >-
      Record what this message states, then use `propose` and `commit` for plan changes. Put choices the agent made in `changes.items` with basis `agent_inference`.
    done: "the commit was accepted, or there was nothing to write."
  - do: >-
      Write `second_part_title` as the second heading. Its first sentence says what differs from the first part, or “Same as above, checked”; then give the rest.
    done: "the second heading and differences sentence are present."
  - do: "Finish each reply; continue an unfinished second part after the user's next message or the researcher's report without calling `turn`."
    done: "each reply is complete, and continuation needs no stored continuation state."
always:
  - Call `turn` first for every trip message; use `scenario="quick"` on the road and list the message's `points`.
  - If `first_part` exists, write its text before any other tool. Query times, last services and opening hours before presenting them as facts; use the returned sentences and windows, and label anything unchecked. Then use `second_part_title`; its first sentence says what differs, or “Same as above, checked”. If a message only continues an unfinished second part, skip `turn` and query directly.
  - Record a user's preferences, facts and decisions before saying they are remembered.
  - Only the user sets precedence between preferences; when they compete, offer two or three options.
  - Only the user's words in this message may change something they called a must.
  - Answer in the user's language; faithfully translate service sentences when needed.
read: >-
  Tool descriptions hold argument shapes; `turn.next` holds only this message's next actions. Repository hosts can read the main skill for the detailed workflow.
