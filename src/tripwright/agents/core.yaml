# Shared rules for chat apps, and the host workflow written into AGENTS.md and the main skill.
intro: >-
  For each trip message: call turn; write the first message as turn's next says, before other tools; check the facts; then answer with second_part_title, differences first, in the user's language. The first message is the first part alone, and every message to the user is the answer itself, never a work note.
steps:
  - do: >-
      Call `turn` first with the message, `scenario: "quick"` on the road, and each named thing in `points`. While Tripwright's tools are still connecting, retry every few seconds (up to about 30) before using the command line; never write about connections.
    done: "`turn` returned."
  - do: >-
      Write the first message before any other tool, as `turn`'s `next` says: one to five lines that answer the most urgent thing the message asks, from `first_part`, `opening_material`, the preferences in `consider` and common sense (stored times go as “the plan stores X, not checked yet”). Send that alone: the second part is its own message, never both headings in one. Then go on without waiting for the user; if you can dispatch a background `tripwright-researcher`, dispatch it to check the facts.
    done: "the first text answers the message's most urgent thing and came before any tool but turn."
  - do: >-
      After the first message, do not call `turn` again; query every fact directly. Write the second part as its own message; when the reply ended after the first message, write it after the user's next message or the researcher's report.
    done: "each actionable fact has a query result or an unchecked label, and no second turn was called."
  - do: >-
      Give the walk or the answer in the conversation before `propose` and `commit`; they and the page update come after the answer. Put what this message states in `turn`'s `record`, with its exact quote, so the requirements are in the ledger before any plan change; link them (`depends_on` and the relations) as `references/records.md` says. Dispatch whom `flow.dispatch` names: facts to `tripwright-researcher`, a changed plan draft to `tripwright-verifier` before commit; without subagents, do the roles in turn as `state(view="role", role="single")` orders them. Use `query(kind="saved")` before searching, then use `propose` and `commit` for plan changes. Say what the accepted commit changed from its `changelog` right after it. Put choices the agent made in `changes.items` with basis `agent_inference`.
    done: "each role `flow.dispatch` named was dispatched or its steps done, and the commit was accepted, or there was nothing to write."
  - do: >-
      Write `second_part_title` as the second heading. Its first sentence says what differs from the first part (or from the road's short message), or “Same as above, checked”; then give the rest.
    done: "the second heading and differences sentence are present."
  - do: "Finish each reply; continue an unfinished second part after the user's next message or the researcher's report without calling `turn`."
    done: "each reply is complete, and continuation needs no stored continuation state."
always:
  - Call `turn` first to record a message or ask on the road (`scenario="quick"`, list `points`); to only read the plan, use `state`.
  - >-
      Write the first message before any other tool but `turn`: one to five lines that answer the most urgent thing, from `first_part`, `opening_material`, `consider` and common sense (times go as “the plan stores X, not checked yet”), and never both headings in one message — the second part is its own message; give the walk or the answer before `propose`/`commit`, and the save and the page follow the answer. Every message to the user is the answer itself, never a work note such as “I'll record your message”. Query times, last services and opening hours before presenting them as facts; use the returned sentences and windows, and label anything unchecked. Then use `second_part_title`; its first sentence says what differs, or “Same as above, checked”. If a message only continues an unfinished second part, skip `turn` and query directly.
  - Record a user's preferences, facts and decisions before saying they are remembered.
  - Only the user sets precedence between preferences; when they compete, offer two or three options.
  - Only the user's words in this message may change something they called a must.
  - Answer in the user's language; faithfully translate service sentences when needed.
read: >-
  Tool descriptions hold argument shapes; `turn.next` holds only this message's next actions. Repository hosts can read the main skill for the detailed workflow.
